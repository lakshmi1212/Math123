name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest on Python 3.10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: |
          pytest tests

      - name: Archive pytest results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .

      - name: Upload pytest HTML report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: ./htmlcov/

      - name: Post Failure Troubleshooting Guide
        if: failure()
        run: |
          echo "::error::Pytest failed. Please review the job logs and artifacts for details."
          echo "Troubleshooting tips:"
          echo "- Check the error tracebacks in the log above."
          echo "- Ensure all dependencies are listed in requirements.txt."
          echo "- Run 'pytest tests' locally to reproduce."
          echo "- For further help, consult the README or contact the DevOps team."

#
# Documentation:
# This workflow runs pytest on every push or pull request to the main branch.
# Python 3.10 is used. All tests under 'tests/' are executed.
# If any test fails, the workflow fails and artifacts are uploaded for debugging.
#
# For more info, see default/README.md or math.json.
# To optimize, consider caching dependencies and using matrix builds for multiple Python versions.
# To scale, integrate with test reporting tools or parallelize test execution.
