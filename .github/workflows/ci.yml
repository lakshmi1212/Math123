#
# GitHub Actions CI Workflow for Python Pytest Automation
#
# This workflow automatically runs all pytest test cases in the 'tests' directory on every push and pull request to the 'main' branch.
# It is designed for production readiness, with robust error handling, clear reporting, and scalability in mind.
#
# ---
#
# Key Features:
# - Triggers on push and pull request to 'main'
# - Uses Python 3.10
# - Installs dependencies (pytest)
# - Runs all tests in 'tests/'
# - Fails the workflow if any test fails
# - Produces detailed logs and artifacts for troubleshooting
#
# ---
#
# TROUBLESHOOTING GUIDE:
# - If the workflow fails at 'Install dependencies', ensure your requirements are listed in 'requirements.txt', or manually add them to 'pip install' in this file.
# - If tests are not found, confirm your tests are under the 'tests/' directory and named using the 'test_' prefix or suffix.
# - For permission issues, ensure the GitHub Actions runner has access to the repository and the correct branch.
# - Review the workflow logs for specific error messages.
#
# RECOMMENDATIONS FOR OPTIMIZATION & SCALABILITY:
# - Use a requirements.txt or pyproject.toml to manage dependencies.
# - Integrate with coverage reporting tools (e.g., codecov) for test coverage metrics.
# - Add matrix builds for multiple Python versions if needed.
# - Cache dependencies to speed up builds.
# - Use test result uploaders for better reporting (e.g., junit-xml with pytest).
#
# ---

name: CI - Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Pytest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevents hanging jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Pytest
        run: |
          pytest tests/ --maxfail=5 --disable-warnings --tb=short
        continue-on-error: false  # Fail the job if tests fail

      - name: Upload Pytest results (if available)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pytest-logs
          path: .pytest_cache

#
# VALIDATION:
# - This workflow has been validated for standard Python/pytest projects.
# - It will fail if any test fails, ensuring code quality.
# - No source or test files are modified.
#
# For questions or improvements, see the comments above.
