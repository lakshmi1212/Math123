# This workflow runs pytest-based tests on every push and pull request to main
#
# Documentation:
# - Triggers: On push to main branch and pull requests targeting main
# - Python version: 3.10
# - Installs dependencies from requirements.txt (including pytest)
# - Runs all tests in the tests/ directory
# - Fails the build if any test fails
# - Provides a summary of test results in the Actions UI
#
# Troubleshooting:
# - If the workflow fails at 'Install dependencies', ensure requirements.txt exists and is valid.
# - If tests fail, review the pytest output in the 'Run tests' step.
# - For Python import errors, check that the src/ directory has an __init__.py if needed.
# - For further debugging, add 'pytest -v' or 'pytest --maxfail=1 --disable-warnings' to get more verbose output.
#
# Optimization/Scalability Recommendations:
# - For larger test suites, consider using pytest-xdist for parallel execution.
# - Cache pip dependencies to speed up builds (see commented cache step below).
# - For advanced reporting, integrate pytest-html or coverage plugins.

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Set up Python dependency caching (optional, uncomment to enable)
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pip-

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          pytest tests/

      - name: Upload pytest results (if needed)
        if: failure()
        run: |
          echo 'See above for pytest output.'

# End of workflow file
