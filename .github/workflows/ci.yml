name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest and generate report
        run: |
          pytest tests/ --maxfail=1 --disable-warnings --tb=short --junitxml=pytest-report.xml
        continue-on-error: false

      - name: Upload Pytest Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Upload Pytest stdout log
        if: always()
        run: |
          if [ -f .pytest_cache ]; then tar -czf pytest-cache.tar.gz .pytest_cache; fi
        continue-on-error: true
      - name: Upload Pytest Cache (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache
          path: pytest-cache.tar.gz
        continue-on-error: true

    # Documentation and Troubleshooting
    # - This workflow runs all tests in the 'tests/' directory on pushes and PRs to 'main'.
    # - If any test fails, the workflow fails.
    # - Pytest XML report is uploaded as an artifact for review.
    # - For troubleshooting, download the pytest-report.xml artifact from the workflow run summary.
    # - Ensure requirements.txt includes all dependencies for your tests.
    # - For larger projects, consider parallelizing jobs, caching dependencies, and matrix testing for multiple Python versions.
